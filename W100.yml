name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to create (e.g. v1.0)'
        required: true
        default: 'v1.0'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.11.1
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -o /tmp/gradle.zip
          unzip -q -o /tmp/gradle.zip -d /opt
          echo "GRADLE=/opt/gradle-8.11.1/bin/gradle" >> "$GITHUB_ENV"
          echo "GRADLE_USER_HOME=/home/runner/.gradle" >> "$GITHUB_ENV"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Generate launcher icons
        run: python3 tools/make_icons.py

      - name: Build signed release APK
        run: $GRADLE :app:assembleRelease --stacktrace

      - name: Run unit and Robolectric tests
        run: $GRADLE :app:testReleaseUnitTest --tests "com.maui.system.CoreLogicTest" --tests "com.maui.system.MauiSmokeTest"

      - name: Generate screenshots from the real app
        run: $GRADLE :app:testReleaseUnitTest --tests "com.maui.system.ScreenshotGenerator"
        continue-on-error: true

      - name: Regenerate the Gradle wrapper
        run: $GRADLE wrapper --gradle-version 8.11.1 --distribution-type bin
        continue-on-error: true

      - name: Commit generated assets (icons, screenshots, wrapper)
        run: |
          git config user.name "maui-ci"
          git config user.email "maui-ci@users.noreply.github.com"
          git add -A app/src/main/res docs/screenshots gradle gradlew gradlew.bat
          if git diff --cached --quiet; then
            echo "no generated changes"
          else
            git commit -m "chore: regenerate icons, screenshots and gradle wrapper"
            git push
          fi
        continue-on-error: true

      - name: Name the asset and compute checksum
        id: pkg
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          cp app/build/outputs/apk/release/app-release.apk "Maui-${VERSION}-release.apk"
          echo "file=Maui-${VERSION}-release.apk" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "Maui-${VERSION}-release.apk" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare release notes
        run: |
          {
            echo "## Maui ${{ steps.pkg.outputs.version }}"
            echo
            echo "A real system layer for Android — floating control panel, live HUD, game toolbar,"
            echo "storage cleaner with hidden & duplicate detection, and an honest RAM & game booster."
            echo
            echo "**Download:** \`${{ steps.pkg.outputs.file }}\` (asset below)"
            echo
            echo "**SHA-256:** \`${{ steps.pkg.outputs.sha256 }}\`"
            echo
            echo "**Install:** download the APK, allow \"install from unknown sources\", install, then open **Maui**"
            echo "and grant the permissions from *Settings → Permissions*."
            echo
            cat RELEASE_NOTES.md
          } > release-notes-final.md

      - name: Create GitHub Release with the APK asset
        uses: softprops/action-gh-release@v2
        with:
          name: Maui ${{ steps.pkg.outputs.version }}
          tag_name: v${{ steps.pkg.outputs.version }}
          body_path: release-notes-final.md
          fail_on_unmatched_files: true
          files: ${{ steps.pkg.outputs.file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
